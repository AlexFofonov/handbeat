<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 696 334" width="696" height="334" role="img" aria-label="Two notes alternate on one voice every 1/60 of a second"><title>Two notes alternate on one voice every 1/60 of a second</title><rect x="1" y="1" width="694" height="332" rx="20" fill="#1F1F22" stroke="#ffffff" stroke-opacity=".10"/><g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-weight="700"><text x="28" y="38" font-size="16" fill="#E9E9EC" text-anchor="start" opacity="1">DER CHIP: EINE STIMME, REIHUM</text><text x="28" y="58" font-size="12" fill="#E9E9EC" text-anchor="start" opacity="0.6">Akkorde entstehen durch blitzschnelles Wechseln der Noten, 60-mal pro Sekunde</text><text x="28" y="94" font-size="12" fill="#A3E635" text-anchor="start" opacity="1">Note 1</text><rect x="28" y="100" width="640" height="26" rx="6" fill="#A3E635"/><text x="28" y="144" font-size="12" fill="#FF4FA3" text-anchor="start" opacity="1">Note 2</text><rect x="28" y="150" width="640" height="26" rx="6" fill="#FF4FA3"/><text x="28" y="206" font-size="12" fill="#E9E9EC" text-anchor="start" opacity="0.8">eine Stimme (das spielt der Chip):</text><rect x="28" y="214" width="640" height="30" rx="6" fill="#121214"/><rect x="28" y="214" width="40" height="30" rx="5" fill="#A3E635"/><rect x="68" y="214" width="40" height="30" rx="5" fill="#FF4FA3"/><rect x="108" y="214" width="40" height="30" rx="5" fill="#A3E635"/><rect x="148" y="214" width="40" height="30" rx="5" fill="#FF4FA3"/><rect x="188" y="214" width="40" height="30" rx="5" fill="#A3E635"/><rect x="228" y="214" width="40" height="30" rx="5" fill="#FF4FA3"/><rect x="268" y="214" width="40" height="30" rx="5" fill="#A3E635"/><rect x="308" y="214" width="40" height="30" rx="5" fill="#FF4FA3"/><rect x="348" y="214" width="40" height="30" rx="5" fill="#A3E635"/><rect x="388" y="214" width="40" height="30" rx="5" fill="#FF4FA3"/><rect x="428" y="214" width="40" height="30" rx="5" fill="#A3E635"/><rect x="468" y="214" width="40" height="30" rx="5" fill="#FF4FA3"/><rect x="508" y="214" width="40" height="30" rx="5" fill="#A3E635"/><rect x="548" y="214" width="40" height="30" rx="5" fill="#FF4FA3"/><rect x="588" y="214" width="40" height="30" rx="5" fill="#A3E635"/><rect x="628" y="214" width="40" height="30" rx="5" fill="#FF4FA3"/><path d="M28 262 h40" stroke="#E9E9EC" stroke-width="2"/><path d="M28 256 v12 M68 256 v12" stroke="#E9E9EC" stroke-width="2"/><text x="76" y="267" font-size="12" fill="#E9E9EC" text-anchor="start" opacity="1">1/60 s</text><text x="28" y="296" font-size="12" fill="#E9E9EC" text-anchor="start" opacity="0.7">zwei Noten: ein Triller mit 30 Hz. drei: ein Flattern mit 20 Hz.</text><text x="28" y="314" font-size="12" fill="#E9E9EC" text-anchor="start" opacity="0.7">eine einzelne Note bleibt ruhig.</text></g></svg>